name        = "Detuned Doom Wash — Seasick Sludge"
description = "A crushing octave-down fuzz wall under a slow, deep, seasick phaser and a cavernous reverb. Stoner/doom at its most subterranean."

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Doom lives on chords that ring, decay and bloom, so the gate barely intrudes —
# a low threshold and a very slow release just keep the fuzz hiss down between the
# slow, deliberate riffs without ever choking a swelling chord.
[noise_gate]
enabled   = true
threshold = 0.15   # low — never clamps the long, ringing chords
release   = 0.45   # very slow — lets everything bloom and decay naturally

# ── Whammy / Pitch shifter ────────────────────────────────────────────────────
# The subterranean weight: an octave *down*, blended under the dry note, so the
# riff carries a fake-baritone sub an octave below. It sits in front of the fuzz,
# so the octave-down copy is fuzzed and fused into the wall rather than sitting on
# top of it — a blend keeps the real fundamental leading so the pitch tracks clean.
[pitch]
enabled = true
pitch = 0.00   # −12 semitones — octave down
mix   = 0.42   # heavy sub weight, but the fundamental still leads
tone  = 0.45   # dark — the sub stays thick, not fizzy

# ── Fuzz ───────────────────────────────────────────────────────────────────────
# The wall: a Big-Muff-style two-stage clipper for the long, singing sustain and
# near-square saturation doom is built on. Fed the octave-down blend, it fuses the
# sub and fundamental into one massive, saturated voice.
[fuzz]
enabled = true
fuzz  = 0.72   # heavy sustain into the cascaded clip stages
tone  = 0.42   # dark and woolly — thick, not buzzy
level = 0.58

# ── Tube Screamer ─────────────────────────────────────────────────────────────
# A near-clean boost tightening the low end so the octave-down blend and fuzz
# don't flub out into mud when the whole wall hits at once.
[tube_screamer]
enabled = true
drive = 0.12   # minimal clip — a tightening boost, not more dirt
tone  = 0.48   # neutral-dark, in keeping with the thick voice
level = 0.72   # hot — firms the front end into the amp

# DS-1 off — the saturation is all fuzz + amp.
[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Amp ───────────────────────────────────────────────────────────────────────
# Marshall JCM800 — raw, grinding tube saturation with the mids kept forward for a
# low-mid wall (a doom tone is dark and thick, never a scooped thrash crunch), and
# a huge downtuned bottom.
[amp]
model  = "marshall"
gain   = 0.80  # saturated but still grinding, not fizzed out
bass   = 0.82  # massive, subterranean low end
mid    = 0.56  # forward — the wall, not a scoop
treble = 0.48  # dark and thick up top, no ice-pick
presence = 0.38  # low — thick, never glassy
master = 0.64

# ── Cabinet ───────────────────────────────────────────────────────────────────
# The Orange PPC412 — heavy closed-back birch, all thick low-mid "wall" — is the
# natural home for the tone: off-axis and roomy for cavernous, dark weight.
[cabinet]
model = "orange"
mic_pos = 0.40   # off-axis — dark, thickens the wall
mic_blend = 0.22 # some ribbon to round the top
mic_room  = 0.30 # roomy — the cavern the doom lives in

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# Post-cab, reinforce the low-mid wall and roll a little off the top so the tone
# reads dark and crushing rather than bright and cutting.
[eq]
enabled = true
low  = 0.55   # reinforces the sub under the wall
mid  = 0.56   # pushes the low-mid wall forward
high = 0.42   # gentle top rolloff — thick and dark

# ── Phaser ────────────────────────────────────────────────────────────────────
# The seasick sway: a very slow, very deep phaser with heavy feedback, at the
# deepest (equal) blend, so the whole wall swirls and lurches underfoot — the
# hallmark of psychedelic stoner-doom.
[phaser]
enabled  = true
rate     = 0.12   # glacially slow — a deep, lurching sway
depth    = 0.90   # a huge sweep across the wall
feedback = 0.60   # resonant, throaty — the notches really bite
mix      = 0.50   # equal dry/wet — deepest phase

# ── Delay ─────────────────────────────────────────────────────────────────────
# Off — the riffs are slow and deliberate; a repeat tail would smear the weight.
[delay]
enabled  = false
time     = 0.30
feedback = 0.30
mix      = 0.00

# ── Reverb ────────────────────────────────────────────────────────────────────
# The cavern: a large, well-damped space that adds cavernous doom weight around the
# wall without washing the palm-mute grind into a bright soak.
[reverb]
enabled = true
room = 0.60   # large, cavernous space
damp = 0.60   # damped — the tail stays dark
mix  = 0.24   # ambience and weight, not a full soak
